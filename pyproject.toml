[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-data-reporting-pipeline"
version = "1.2.0"
description = "Governed recurring reporting with Excel, Power Query evidence, multi-source ingestion, reconciliation and management delivery."
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
