name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest -q
      - name: Smoke evidence
        run: python -m reporting_pipeline.cli smoke
      - name: Generate delivery artefact
        run: |
          python -m reporting_pipeline.cli deliver
          test -s output/management_report.html
      - name: Generate Excel evidence
        run: |
          python -m reporting_pipeline.cli excel-demo
          test -s output/source_messy_reporting.xlsx
          test -s output/clean_management_report.xlsx
          test -s output/excel_evidence.json
      - name: Build operational evidence
        run: |
          python -m reporting_pipeline.cli operate
          test -s output/operational/run_manifest.json
      - name: Reverse-test evidence
        run: python -m reporting_pipeline.cli reverse-test
      - name: Publish evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: reporting-evidence
          path: |
            output/management_report.html
            output/source_messy_reporting.xlsx
            output/clean_management_report.xlsx
            output/excel_evidence.json
            output/operational/
          if-no-files-found: error
